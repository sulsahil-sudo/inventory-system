<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>المنتجات</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f3f4f6;
padding:12px;
}

.header{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.header h2{
text-align:center;
}

.card{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
width:100%;
padding:14px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

button{
width:100%;
height:52px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
}

.add-btn{
background:#16a34a;
color:white;
}

.delete-btn{
background:#dc2626;
color:white;
margin-top:10px;
}

.counter{
text-align:center;
font-weight:bold;
margin-top:10px;
color:#2563eb;
}

.product{
background:white;
padding:14px;
border-radius:14px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-name{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.line{
margin-top:4px;
font-size:15px;
}

.empty{
background:white;
padding:20px;
text-align:center;
border-radius:14px;
}

</style>

</head>
<body>

<div class="header">

<h2>
📦 إدارة المنتجات
</h2>

</div>

<div class="card">

<input
id="name"
placeholder="اسم المنتج">

<input
id="category"
placeholder="الفئة">

<input
id="quantity"
type="number"
placeholder="الكمية">

<input
id="price"
type="number"
placeholder="السعر">

<input
id="expiry"
type="date">

<button
class="add-btn"
onclick="addProduct()">

➕ إضافة منتج

</button>

<div
class="counter"
id="counter">

عدد المنتجات: 0

</div>

</div>

<div id="list"></div>

<script>

function getProducts(){

return JSON.parse(

localStorage.getItem(
"products"
)

) || [];

}

function saveProducts(products){

localStorage.setItem(

"products",

JSON.stringify(products)

);

}

function addProduct(){

const name =
document.getElementById(
"name"
).value.trim();

if(!name){

alert(
"اكتب اسم المنتج"
);

return;

}

const product = {

id:Date.now(),

name:name,

category:
document.getElementById(
"category"
).value,

quantity:
document.getElementById(
"quantity"
).value,

price:
document.getElementById(
"price"
).value,

expiry:
document.getElementById(
"expiry"
).value

};

const products =
getProducts();

products.push(product);

saveProducts(products);

document.getElementById(
"name"
).value="";

document.getElementById(
"category"
).value="";

document.getElementById(
"quantity"
).value="";

document.getElementById(
"price"
).value="";

document.getElementById(
"expiry"
).value="";

render();

}

function deleteProduct(id){

if(!confirm("حذف المنتج؟")){

return;

}

const products =

getProducts().filter(

p=>p.id!==id

);

saveProducts(products);

render();

}

function render(){

const products =
getProducts();

const list =
document.getElementById(
"list"
);

document.getElementById(
"counter"
).textContent =

"عدد المنتجات: " +
products.length;

if(products.length===0){

list.innerHTML=

'<div class="empty">لا توجد منتجات</div>';

return;

}

list.innerHTML="";

products.forEach(p=>{

list.innerHTML += `

<div class="product">

<div class="product-name">

📦 ${p.name}

</div>

<div class="line">

🏷 ${p.category || "-"}

</div>

<div class="line">

📊 الكمية:
${p.quantity || 0}

</div>

<div class="line">

💰 السعر:
${p.price || 0}

ريال

</div>

<div class="line">

📅
${p.expiry || "-"}

</div>

<button
class="delete-btn"
onclick="deleteProduct(${p.id})">

🗑 حذف

</button>

</div>

`;

});

}

render();

</script>

</body>
</html>
