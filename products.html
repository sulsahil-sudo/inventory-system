<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة المنتجات</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f3f4f6;
padding:12px;
}

.header{
background:#fff;
padding:18px;
border-radius:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
text-align:center;
}

.card{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input,
select{
width:100%;
padding:14px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

button{
width:100%;
height:52px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.camera-btn{
background:#2563eb;
color:white;
margin-bottom:10px;
}

.add-btn{
background:#16a34a;
color:white;
}

.add-btn:disabled{
background:#9ca3af;
cursor:not-allowed;
}

.edit-btn{
background:#f59e0b;
color:white;
margin-top:10px;
}

.delete-btn{
background:#dc2626;
color:white;
margin-top:10px;
}

.counter{
text-align:center;
font-weight:bold;
margin-top:10px;
margin-bottom:10px;
color:#2563eb;
}

.preview{
width:100%;
border-radius:12px;
display:none;
margin-bottom:10px;
}

.product{
background:#fff;
padding:14px;
border-radius:14px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-image{
width:100%;
border-radius:12px;
margin-bottom:10px;
}

.product-name{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.line{
margin-top:6px;
}

.empty{
background:#fff;
padding:20px;
border-radius:14px;
text-align:center;
}

</style>
</head>

<body>

<div class="header">

<h2>
📦 إدارة المنتجات
</h2>

</div>

<div class="card">

<input
id="name"
placeholder="اسم المنتج *">

<button
type="button"
class="camera-btn"
onclick="openCamera()">

📷 اختيار أو تصوير منتج

</button>

<input
type="file"
id="cameraInput"
accept="image/*"
style="display:none">

<img
id="preview"
class="preview">

<select id="category">

<option value="">
اختر الفئة *
</option>

<option value="معلبات">معلبات</option>
<option value="حبوب">حبوب</option>
<option value="بقوليات">بقوليات</option>
<option value="ألبان">ألبان</option>
<option value="مشروبات">مشروبات</option>
<option value="حلويات">حلويات</option>
<option value="مجمدات">مجمدات</option>
<option value="منظفات">منظفات</option>
<option value="أدوية">أدوية</option>
<option value="أخرى">أخرى</option>

</select>

<input
id="quantity"
type="number"
placeholder="الكمية *">

<input
id="price"
type="number"
placeholder="السعر *">

<input
id="expiry"
type="date">

<button
id="addBtn"
class="add-btn"
disabled
onclick="addProduct()">

➕ إضافة منتج

</button>

<div
class="counter"
id="counter">

عدد المنتجات : 0

</div>

<input
id="searchBox"
placeholder="🔍 البحث">

<select id="filterCategory">

<option value="">
كل الفئات
</option>

<option value="معلبات">معلبات</option>
<option value="حبوب">حبوب</option>
<option value="بقوليات">بقوليات</option>
<option value="ألبان">ألبان</option>
<option value="مشروبات">مشروبات</option>
<option value="حلويات">حلويات</option>
<option value="مجمدات">مجمدات</option>
<option value="منظفات">منظفات</option>
<option value="أدوية">أدوية</option>
<option value="أخرى">أخرى</option>

</select>

</div>

<div id="productsList"></div>

<script>
  let currentImage = "";
let editingId = null;

function openCamera(){

document.getElementById(
"cameraInput"
).click();

}

document.getElementById(
"cameraInput"
).addEventListener(
"change",
function(event){

const file =
event.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload =
function(){

currentImage =
reader.result;

const preview =
document.getElementById(
"preview"
);

preview.src =
reader.result;

preview.style.display =
"block";

};

reader.readAsDataURL(file);

});

function getProducts(){

return JSON.parse(
localStorage.getItem(
"products"
)
) || [];

}

function saveProducts(products){

localStorage.setItem(
"products",
JSON.stringify(products)
);

}

function validateForm(){

const valid =

document.getElementById(
"name"
).value.trim()

&&

document.getElementById(
"category"
).value

&&

document.getElementById(
"quantity"
).value

&&

document.getElementById(
"price"
).value

&&

document.getElementById(
"expiry"
).value;

document.getElementById(
"addBtn"
).disabled = !valid;

}

document
.querySelectorAll(
"input,select"
)
.forEach(el=>{

el.addEventListener(
"input",
validateForm
);

el.addEventListener(
"change",
validateForm
);

});

function clearForm(){

document.getElementById(
"name"
).value="";

document.getElementById(
"category"
).value="";

document.getElementById(
"quantity"
).value="";

document.getElementById(
"price"
).value="";

document.getElementById(
"expiry"
).value="";

document.getElementById(
"preview"
).style.display =
"none";

currentImage="";

editingId = null;

document.getElementById(
"addBtn"
).textContent =
"➕ إضافة منتج";

validateForm();

}

function addProduct(){
const name =
document.getElementById(
"name"
).value.trim();

const category =
document.getElementById(
"category"
).value;

const quantity =
document.getElementById(
"quantity"
).value;

const price =
document.getElementById(
"price"
).value;

const expiry =
document.getElementById(
"expiry"
).value;

if(
!name ||
!category ||
!quantity ||
!price
){
alert(
"أكمل الحقول المطلوبة"
);
return;
}
const products =
getProducts();
if(editingId){
if(
!confirm(
"هل تريد تحديث المنتج؟"
)
){
return;
}

const index =
products.findIndex(
p=>p.id===editingId
);

products[index] = {

id:editingId,

name,

category,

quantity,

price,

expiry,

image:currentImage

};

saveProducts(products);

alert(
"✅ تم تحديث المنتج"
);

clearForm();

render();

return;

}

products.push({

id:Date.now(),

name,

category,

quantity,

price,

expiry,

image:currentImage

});

saveProducts(products);

alert(
"✅ تم إضافة المنتج"
);

clearForm();

render();

}

function deleteProduct(id){

if(
!confirm(
"هل تريد حذف المنتج؟"
)
){
return;
}

const products =

getProducts().filter(
p=>p.id!==id
);

saveProducts(products);

render();

}

function editProduct(id){

const products =
getProducts();

const product =
products.find(
p=>p.id===id
);

if(!product) return;

editingId = id;

document.getElementById(
"name"
).value =
product.name;

document.getElementById(
"category"
).value =
product.category;

document.getElementById(
"quantity"
).value =
product.quantity;

document.getElementById(
"price"
).value =
product.price;

document.getElementById(
"expiry"
).value =
product.expiry;

currentImage =
product.image || "";

if(currentImage){

const preview =
document.getElementById(
"preview"
);

preview.src =
currentImage;

preview.style.display =
"block";

}

document.getElementById(
"addBtn"
).textContent =
"🔄 تحديث المنتج";

validateForm();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function render(){

const products =
getProducts();

const searchTerm =

document.getElementById(
"searchBox"
).value.toLowerCase();

const filterCategory =

document.getElementById(
"filterCategory"
).value;

const filteredProducts =

products.filter(p=>{

const matchName =

p.name
.toLowerCase()
.includes(searchTerm);

const matchCategory =

filterCategory === ""

||

p.category ===
filterCategory;

return(
matchName &&
matchCategory
);

});

document.getElementById(
"counter"
).textContent =

"عدد المنتجات : "
+
products.length;

const list =
document.getElementById(
"productsList"
);

if(filteredProducts.length===0){

list.innerHTML =

'<div class="empty">لا توجد منتجات</div>';

return;

}

list.innerHTML="";

filteredProducts.forEach(p=>{

list.innerHTML += `

<div class="product">

${p.image ?

`<img
src="${p.image}"
class="product-image">`

: ""}

<div class="product-name">
📦 ${p.name}
</div>

<div class="line">
🏷 ${p.category}
</div>

<div class="line">
📊 الكمية:
${p.quantity}
</div>

<div class="line">
💰 السعر:
${p.price} ريال
</div>

<div class="line">
📅 ${p.expiry}
</div>

<button
class="edit-btn"
onclick="editProduct(${p.id})">

✏️ تعديل

</button>

<button
class="delete-btn"
onclick="deleteProduct(${p.id})">

🗑 حذف

</button>

</div>

`;

});

}

document.getElementById(
"searchBox"
).addEventListener(
"input",
render
);

document.getElementById(
"filterCategory"
).addEventListener(
"change",
render
);

render();
  </script>
 
</body>
</html>
