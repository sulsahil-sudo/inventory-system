<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتجات</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f3f4f6;
padding:12px;
}

.header{
background:white;
padding:18px;
border-radius:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.header h1{
font-size:28px;
text-align:center;
}

.card{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ddd;
border-radius:12px;
margin-bottom:10px;
}

button{
width:100%;
height:54px;
border:none;
border-radius:12px;
background:#16a34a;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.counter{
margin-top:10px;
text-align:center;
font-weight:bold;
color:#2563eb;
}

.product{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:10px;
box-shadow:0 1px 6px rgba(0,0,0,.08);
}

.product-name{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.delete-btn{
background:#dc2626;
height:42px;
font-size:15px;
}

.empty{
text-align:center;
padding:20px;
color:#666;
}

</style>

</head>
<body>

<div class="header">

<h1>
📦 إدارة المنتجات
</h1>

</div>

<div class="card">

<input
id="productName"
placeholder="اسم المنتج">

<button onclick="addProduct()">

إضافة منتج

</button>

<div
class="counter"
id="counter">

عدد المنتجات: 0

</div>

</div>

<div id="productsList">

<div class="empty">

لا توجد منتجات

</div>

</div>

<script>

function getProducts(){

return JSON.parse(
localStorage.getItem(
"products"
)
) || [];

}

function saveProducts(products){

localStorage.setItem(
"products",
JSON.stringify(products)
);

}

function addProduct(){

const input =
document.getElementById(
"productName"
);

const name =
input.value.trim();

if(name === ""){

alert(
"اكتب اسم المنتج"
);

return;

}

const products =
getProducts();

products.push({

id:Date.now(),

name:name

});

saveProducts(products);

input.value="";

renderProducts();

}

function deleteProduct(id){

const products =
getProducts().filter(

p => p.id !== id

);

saveProducts(products);

renderProducts();

}

function renderProducts(){

const products =
getProducts();

const list =
document.getElementById(
"productsList"
);

document.getElementById(
"counter"
).textContent =

"عدد المنتجات: " +
products.length;

if(products.length === 0){

list.innerHTML = `

<div class="empty">

لا توجد منتجات

</div>

`;

return;

}

list.innerHTML = "";

products.forEach(product=>{

list.innerHTML += `

<div class="product">

<div class="product-name">

📦 ${product.name}

</div>

<button
class="delete-btn"
onclick="deleteProduct(${product.id})">

حذف

</button>

</div>

`;

});

}

renderProducts();

</script>

</body>
</html>
