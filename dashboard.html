<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم</title>

<style>
body{
font-family:tahoma;
background:#f4f6f9;
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.btn{
display:block;
background:#2563eb;
color:white;
text-decoration:none;
padding:14px;
margin-top:10px;
border-radius:10px;
text-align:center;
}

.stat{
font-size:28px;
font-weight:bold;
color:#2563eb;
}
</style>
</head>

<body>

<div class="card">

<h2>📦 لوحة التحكم</h2>

<p id="familyName"></p>

</div>

<div class="card">

عدد المنتجات

<div
class="stat"
id="productsCount">

0

</div>

</div>

<a
class="btn"
href="products.html">

📦 إدارة المنتجات

</a>

<script>

const user =
JSON.parse(

localStorage.getItem(
"currentUser"
)

);

document.getElementById(
"familyName"
).textContent =
user.family;

const products =

JSON.parse(

localStorage.getItem(
"products"
)

) || [];

document.getElementById(
"productsCount"
).textContent =
products.length;

</script>

</body>
</html>
